[package]
name = "agroconnect"
version = "4.0.0"
description = "AgroConnect Tauri Edition"
authors = ["Rodrigo Leonel Huayta Mamani"]
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "agroconnect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
